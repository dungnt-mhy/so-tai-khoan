# Sổ tài khoản — Cloudflare Workers + D1 + R2
# Tài khoản Cloudflare MỚI, độc lập hoàn toàn với tài khoản cũ.
# Account: dungnt.storage@gmail.com, ID b4b733068462ffa3b17a0941c631e0e8
# Deploy bằng API trực tiếp (xem docs/DEPLOY.md); wrangler.toml giữ lại
